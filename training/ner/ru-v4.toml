# NER ru-v4: v4.2 fine-tuned on the Russian corpus plus Russian nym rows, with the replay the
# v4.2 recipe itself used wherever it is public: OpenPII (23 languages), kiji, nym, E3, pii-anon
# (hf_v41.py --per-language 600), the hard negatives (negatives*.py) and the v4.2 targeted
# templates. ru-v1..v3 replayed OpenPII only and lost formal documents, plates and reference
# numbers (nym-ru test: leak 0.4 % -> 1.4 % without SECRET). Fictional / synthetic data only.
# Report-only: ru-holdout, the nym-ru test (600) and eval2; none of them picks the checkpoint.

