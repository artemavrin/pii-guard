# NER ru-v2: v4.2 fine-tuned on the Russian corpus with OpenPII replay in all 23 of its languages
# (ru-v1 replayed only hu/en/de and lost a few es/fr/nl/mt values). Fictional / synthetic data only.
# OpenPII has no mt/ga rows; those two languages get no replay.
#   training/ner/openpii.py --train hu=1500,en=1500,de=1500,<20 langs>=400 \
#     --dev hu=150,en=150,de=150,<20 langs>=40 --out eval/generated/ru-corpus/replay2
# The Russian training file is listed four times (~3.6k ru vs ~12.5k replay rows).

base_model = "watt-mind/pii-guard-ner-xlmr-base"   # v4.2, Apache-2.0
base_revision = "33ef18fed56abd06e8caeb4ad0268633d5346ed5"
train = [
  "eval/generated/ru-corpus/ru-train.jsonl",
