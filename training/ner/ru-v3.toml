# NER ru-v3: ru-v2's recipe (v4.2 + Russian corpus + OpenPII replay in 23 languages) plus ~180
# Russian documents aimed at what ru-v2 got wrong on the closed eval2 set (eval/generated/ru/eval2,
# never trained on): numbers and streets next to addresses, look-alike reference numbers, initials,
# diminutives, short surnames and name-like words. Own name pools 217-219. Fictional data only.
#   docs/ru/corpus/build.py build eval/generated/ru-corpus/ru-v3-add.jsonl eval/generated/ru/raw/v3_*.jsonl
# Both Russian training files are listed four times.

base_model = "watt-mind/pii-guard-ner-xlmr-base"   # v4.2, Apache-2.0
