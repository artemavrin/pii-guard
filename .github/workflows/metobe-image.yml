# The masking service for Metobe (Dockerfile.metobe): built on GitHub's own machines for linux/amd64 and linux/arm64,
# like Metobe's image, and published as ghcr.io/<owner>/pii-guard. The NER weights are not in git (1 GB): they come
# from the release `model-<MODEL>` of this repository. The image is tagged by its model (what Metobe's compose.yml pins)
# and by its commit.
name: metobe-image

on:
  push:
    branches: [main]
    paths:
      - src/**
      - pyproject.toml
      - uv.lock
      - Dockerfile.metobe
      - .github/workflows/metobe-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # The checkpoint baked in; a new one is a new release `model-<MODEL>` and a change here.
  MODEL: ru-s34
  MODEL_SHA256: 6643102a7981126c05427634ee513de3fee4d48916273b67bbd0b9c18099dbb6
  IMAGE: ghcr.io/${{ github.repository_owner }}/pii-guard

concurrency:
  group: metobe-image
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The NER weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "model-$MODEL" --repo "$GITHUB_REPOSITORY" --pattern "$MODEL.tar.gz" --dir /tmp
          echo "$MODEL_SHA256  /tmp/$MODEL.tar.gz" | sha256sum --check
          mkdir -p /tmp/model
          tar xzf "/tmp/$MODEL.tar.gz" -C /tmp/model
          ls -la /tmp/model
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.metobe
          build-contexts: model=/tmp/model
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PII Guard for Metobe: Russian NER ${{ env.MODEL }}, fast mode
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  # Both platforms under one tag; a platform whose build failed is left out, so the other still ships.
  merge:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag by model and commit
        working-directory: /tmp/digests
        run: |
          ls
          docker buildx imagetools create -t "$IMAGE:$MODEL" -t "$IMAGE:sha-${GITHUB_SHA::7}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$MODEL"
